<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống Quản lý - Lux Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .brand-title { font-size: 28px; font-weight: bold; color: #0f172a; margin-bottom: 8px; }
        .brand-title span { color: #2563eb; }
        .sub-title { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        .error-message { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; text-align: left; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">Lux <span>Mobile</span></h1>
        <p class="sub-title">Đăng nhập Hệ thống Quản lý (Staff & Admin)</p>

        <!-- Khối hiển thị thông báo lỗi (Dành cho mục Ngoại lệ trong đề bài) -->
        <div id="error-box" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email..." required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Hủy tiến trình mặc định
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');

            // Tài khoản mẫu thử nghiệm
            const validEmail = "admin@luxmobile.com";
            const validPassword = "123";

            // Kiểm tra thông tin (Luồng 3 & Ngoại lệ trong Use Case)
            if (email === validEmail && password === validPassword) {
                errorBox.style.display = 'none';
                // Đăng nhập thành công -> Chuyển sang giao diện quản lý
                window.location.href = "dashboard.html";
            } else {
                // Ngoại lệ: Hiển thị thông báo lỗi
                errorBox.textContent = "Email hoặc mật khẩu không chính xác! Vui lòng thử lại.";
                errorBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
